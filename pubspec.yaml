name: jordan_bus_tracker_new
description: "Jordan Bus Tracker App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Core
  provider: ^6.1.2
  flutter_dotenv: ^5.1.0

  # Firebase
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.3

  # Location & Maps
  geolocator: ^13.0.1
  mapbox_maps_flutter: ^2.0.0

  # Helpers
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/