name: jordan_bus_tracker_new
description: "A comprehensive bus tracking application for Jordan"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  provider: ^6.1.2
  flutter_dotenv: ^6.0.1
  intl: any

  # Firebase
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  firebase_storage: ^13.4.6
  firebase_analytics: ^12.1.0

  # Location & Maps
  geolocator: ^14.0.3
  mapbox_maps_flutter: 2.0.0
  url_launcher: ^6.3.1

  # Helpers
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  logger: ^2.4.0
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # مطلوب لـ flutter_dotenv (أنشئ .env محلياً من .env.example)
    - .env
    - .env.example
