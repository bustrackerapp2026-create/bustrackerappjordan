name: bus_tracker_app
description: A new Flutter project for bus tracking in Jordan.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  cloud_firestore: ^5.6.0
  firebase_auth: ^5.3.4
  google_maps_flutter: ^2.10.0
  mapbox_maps_flutter: ^2.28.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  provider: ^6.1.2
  flutter_dotenv: ^5.2.1
  http: ^1.2.2
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1A73E8"
  adaptive_icon_foreground: "assets/images/app_icon.png"
