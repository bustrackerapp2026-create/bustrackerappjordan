name: Validate RouteProgress Hub Patch

on:
  push:
    branches:
      - "stage/route-progress-hub-integration-v1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test RouteProgress Hub integration
        run: flutter test test/driver_tracking_hub_route_progress_test.dart
      - name: Full test suite
        run: flutter test
