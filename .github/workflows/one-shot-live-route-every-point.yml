name: One-shot every-point live route rendering
on:
  push:
    paths:
      - '.github/workflows/one-shot-live-route-every-point.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit patch
        run: |
          dart format lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart
          git commit -m 'fix(admin-map): render and snap every route point immediately'
          git push
          git rm .github/workflows/one-shot-live-route-every-point.yml
          git commit -m 'chore: remove one-shot route rendering workflow'
          git push
