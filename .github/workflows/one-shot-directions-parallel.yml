name: One-shot parallel directions test

on:
  push:
    paths:
      - '.github/workflows/one-shot-directions-parallel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/vehicle-trip
          fetch-depth: 0

      - name: Remove live Directions serialization
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart')
          s = p.read_text(encoding='utf-8')
          old = '''      List<RoutePoint> road;\n      await _beginDirectionsOp();\n      try {\n        road = await _drawRouteService.getDrivingPath(\n          from: a,\n          to: b,\n          attachControlEndpoints: false,\n        );\n      } finally {\n        _endDirectionsOp();\n      }\n'''
          new = '''      // Directions requests are independent per segment. Keep them concurrent\n      // so rapid taps do not create a growing road-rendering backlog.\n      final road = await _drawRouteService.getDrivingPath(\n        from: a,\n        to: b,\n        attachControlEndpoints: false,\n      );\n'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart
          git commit -m "fix(admin-map): allow parallel directions requests"
          git rm .github/workflows/one-shot-directions-parallel.yml
          git commit -m "chore: remove one-shot directions workflow"
          git push origin HEAD:integrate/vehicle-trip
