name: One-shot prompt live route patch

on:
  push:
    branches:
      - integrate/vehicle-trip

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/vehicle-trip
          fetch-depth: 0

      - name: Remove render batching and reduce delay
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart')
          s = p.read_text(encoding='utf-8')

          s, n = re.subn(
              r"\n  // Diagnostic render batching:.*?\n  int _nextLiveRenderPoint = 2;\n",
              "\n",
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('render batching declaration not found')

          s = s.replace('      _nextLiveRenderPoint = 2;\n', '')

          s, n = re.subn(
              r"\n    final isRenderRequest = phase == 'temp' \|\| phase == 'temp-fallback' \|\|\n        phase == 'final' \|\| phase == 'final-fallback';\n    if \(isRenderRequest && _drawPoints\.length >= 2 &&\n        _drawPoints\.length < _nextLiveRenderPoint\) return;\n    if \(isRenderRequest && _drawPoints\.length >= _nextLiveRenderPoint\) \{\n      _nextLiveRenderPoint = _drawPoints\.length \+ 4;\n    \}\n",
              "\n",
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('render batching logic not found')

          count = s.count('Duration(milliseconds: 250)')
          if count != 2:
              raise SystemExit(f'expected two 250ms delays, found {count}')
          s = s.replace('Duration(milliseconds: 250)', 'Duration(milliseconds: 40)')
          p.write_text(s, encoding='utf-8')

      - name: Commit and remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart
          git commit -m 'fix(admin-map): render each route point promptly'
          git push origin integrate/vehicle-trip
          git rm .github/workflows/one-shot-live-route-batching.yml
          git commit -m 'chore: remove temporary route patch workflow'
          git push origin integrate/vehicle-trip
