name: One-shot route every-point fix
on:
  push:
    paths:
      - '.github/workflows/one-shot-route-every-point-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove point batching and reduce render delay
        run: |
          python3 -c "from pathlib import Path; p=Path('lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart'); s=p.read_text(); import re; s=re.sub(r'\\n  // Diagnostic render batching:.*?int _nextLiveRenderPoint = 2;\\n','\\n',s,flags=re.S); s=s.replace('      _nextLiveRenderPoint = 2;\\n',''); s=s.replace('Duration(milliseconds: 250)','Duration(milliseconds: 40)'); p.write_text(s)"
      - name: Verify and commit
        run: |
          dart format lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart
          git commit -m 'fix(admin-map): render route after every point'
          git push
          git rm .github/workflows/one-shot-route-every-point-fix.yml .github/workflows/one-shot-live-route-every-point.yml
          git commit -m 'chore: remove one-shot route workflows'
          git push
