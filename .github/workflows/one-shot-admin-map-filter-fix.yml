name: One-shot admin map filter fix

on:
  push:
    branches:
      - integrate/vehicle-trip

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate admin map label filter call
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/admin/screens/tabs/admin_map_tab.dart')
          text = path.read_text(encoding='utf-8')
          old = "      listenToPickupPoints();\n      applyLabelLayersFilter();\n      _scheduleFocusRequest();"
          new = "      listenToPickupPoints();\n      _scheduleFocusRequest();"
          if old not in text:
              raise SystemExit('Expected admin_map_tab snippet was not found; aborting.')
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one duplicate filter snippet; aborting.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm .github/workflows/one-shot-admin-map-filter-fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/admin/screens/tabs/admin_map_tab.dart .github/workflows/one-shot-admin-map-filter-fix.yml
          git diff --cached --check
          git commit -m "fix(admin-map): remove duplicate label filter"
          git push origin HEAD:integrate/vehicle-trip
