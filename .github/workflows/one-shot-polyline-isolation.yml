name: One-shot isolate live polyline

on:
  push:
    branches:
      - integrate/vehicle-trip

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'test(admin-map): isolate polyline rendering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/vehicle-trip
          fetch-depth: 0
      - name: Disable live PolylineAnnotation redraw
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart')
          s = p.read_text(encoding='utf-8')
          marker = "  static const bool _liveDirectionsEnabled = false;\n"
          addition = "\n  // Diagnostic switch: disable every live PolylineAnnotation redraw while\n  // keeping point capture and road snapping active.\n  static const bool _livePolylineEnabled = false;\n"
          if '_livePolylineEnabled' not in s:
              if marker not in s:
                  raise SystemExit('Directions diagnostic switch not found')
              s = s.replace(marker, marker + addition, 1)
          old = """    if (!mounted) return;\n\n    // Temporary redraws: keep only the newest geometry while a native write is running.\n"""
          new = """    if (!mounted) return;\n    if (!_livePolylineEnabled) return;\n\n    // Temporary redraws: keep only the newest geometry while a native write is running.\n"""
          if old in s:
              s = s.replace(old, new, 1)
          elif "if (!_livePolylineEnabled) return;" not in s:
              raise SystemExit('Polyline redraw marker not found')
          p.write_text(s, encoding='utf-8')
      - name: Commit diagnostic patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-polyline-isolation.yml
          git add lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart .github/workflows/one-shot-polyline-isolation.yml
          git commit -m "test(admin-map): isolate polyline rendering"
          git push origin integrate/vehicle-trip
