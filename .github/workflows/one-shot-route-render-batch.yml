name: One-shot route render batching

on:
  push:
    branches: [integrate/vehicle-trip]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch route renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart')
          s = p.read_text()
          old = "  int _tempCoalesceRunnerEpoch = 0;\n\n  List<RoutePoint> get _flattenedRoadPath {"
          new = "  int _tempCoalesceRunnerEpoch = 0;\n\n  // Diagnostic render batching: keep all captured/Directions geometry, but\n  // update the native route layer only on the first two points and then every\n  // four points.\n  int _nextLiveRenderPoint = 2;\n\n  List<RoutePoint> get _flattenedRoadPath {"
          assert old in s
          s = s.replace(old, new, 1)
          old = "      _roadSegments.clear();\n    });\n    unawaited(_clearDrawVisuals());"
          new = "      _roadSegments.clear();\n      _nextLiveRenderPoint = 2;\n    });\n    unawaited(_clearDrawVisuals());"
          assert old in s
          s = s.replace(old, new, 1)
          old = "    if (!mounted || !_livePolylineEnabled) return;\n\n    if (phase == 'temp' || phase == 'temp-fallback') {"
          new = "    if (!mounted || !_livePolylineEnabled) return;\n\n    final isRenderRequest = phase == 'temp' || phase == 'temp-fallback' ||\n        phase == 'final' || phase == 'final-fallback';\n    if (isRenderRequest && _drawPoints.length >= 2 &&\n        _drawPoints.length < _nextLiveRenderPoint) return;\n    if (isRenderRequest && _drawPoints.length >= _nextLiveRenderPoint) {\n      _nextLiveRenderPoint = _drawPoints.length + 4;\n    }\n\n    if (phase == 'temp' || phase == 'temp-fallback') {"
          assert old in s
          s = s.replace(old, new, 1)
          old = "      _drawPoints.clear();\n      _roadSegments.clear();\n    });\n    await _clearDrawVisuals();"
          new = "      _drawPoints.clear();\n      _roadSegments.clear();\n      _nextLiveRenderPoint = 2;\n    });\n    await _clearDrawVisuals();"
          assert old in s
          s = s.replace(old, new, 1)
          old = "    _drawPoints.clear();\n    _roadSegments.clear();\n    _drawLine = null;"
          new = "    _drawPoints.clear();\n    _roadSegments.clear();\n    _nextLiveRenderPoint = 2;\n    _drawLine = null;"
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart
          git rm .github/workflows/one-shot-route-render-batch.yml
          git commit -m "fix(admin-map): batch live route rendering"
          git push origin HEAD:integrate/vehicle-trip
