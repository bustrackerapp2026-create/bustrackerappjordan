name: One-shot fix stale render reference
on:
  push:
    branches:
      - integrate/vehicle-trip
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/vehicle-trip
          fetch-depth: 0
      - name: Remove stale reference
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart')
          s = p.read_text(encoding='utf-8')
          old = '    _nextLiveRenderPoint = 2;\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale reference, found {s.count(old)}')
          p.write_text(s.replace(old, '', 1), encoding='utf-8')
      - name: Validate analyzer
        run: |
          git diff --check
          flutter --version
          flutter analyze
      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-fix-unused-render-state.yml .github/workflows/one-shot-fix-unused-render-state-push.yml
          git add lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart .github/workflows/one-shot-fix-unused-render-state.yml .github/workflows/one-shot-fix-unused-render-state-push.yml
          git commit -m "fix(admin-map): remove stale render reference"
          git push origin integrate/vehicle-trip
