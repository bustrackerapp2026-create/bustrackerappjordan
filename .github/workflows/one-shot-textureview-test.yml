name: One-shot admin map texture test

on:
  push:
    branches:
      - integrate/vehicle-trip

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'test(admin-map): switch Mapbox away from TextureView'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/vehicle-trip
          fetch-depth: 0
      - name: Apply focused Mapbox rendering test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/admin/screens/tabs/admin_map_tab.dart')
          s = p.read_text()
          old = "            textureView: true,"
          new = "            textureView: false,"
          if old not in s:
              raise SystemExit('target textureView line not found')
          p.write_text(s.replace(old, new, 1))
          w = Path('.github/workflows/one-shot-textureview-test.yml')
          w.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/admin/screens/tabs/admin_map_tab.dart .github/workflows/one-shot-textureview-test.yml
          git commit -m "test(admin-map): switch Mapbox away from TextureView"
          git push origin integrate/vehicle-trip

# trigger the one-shot diagnostic patch
