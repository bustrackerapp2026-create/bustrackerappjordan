name: Patch every-point route rendering
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          sed -i '/Diagnostic render batching:/,+3d' lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart
          sed -i '/_nextLiveRenderPoint = 2;/d' lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart
          sed -i 's/milliseconds: 250/milliseconds: 40/g' lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart
      - name: Commit
        run: |
          dart format lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/admin/screens/tabs/mixins/admin_draw_route_mixin.dart
          git commit -m 'fix(admin-map): render route after every point'
          git push
